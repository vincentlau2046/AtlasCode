# Atlas 站点 Nginx 配置
# 部署位置：/etc/nginx/conf.d/atlas.conf
# 服务器：阿里云 ECS · 47.104.200.186（Alibaba Cloud Linux 3）
#
# 架构：系统 Nginx 直接对外（80 端口）。此前占 80/443 的 Docker 栈
#       （Harbor/NPM/Portainer）已停用——容器与数据保留，docker start 可恢复。
# 备案通过 + DNS 解析后：跑 certbot --nginx 一键上 HTTPS。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 域名解析生效后按名字匹配；备案期间用 IP 访问走 default_server 兜底
    server_name atlaswork.cn www.atlaswork.cn;

    root /var/www/atlas;
    index index.html;

    # 静态资源缓存 7 天
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
