# 发布通道（§8.74.31 S5 升级，#197）：npm trusted publisher（OIDC）。
# 前提：npm 侧已建 trusted publisher（provider=GitHub Actions，repo=本仓，
# workflow 文件名=publish.yml，固定不可改——改须删了重建）。
# 触发：推 tag v*（版本纪律：0.1.x 自主 tag，跨 0.2/1.0 须问用户）或 Actions 页手动
# Run workflow。runner（非国内网络）直连 registry.npmjs.org，免本地 token：
# OIDC 免密 + `--provenance` 供应链 attestation（包 ↔ 本 run 绑定）。
# 本地 ~/.npmrc registry 域 token 发布降为应急 fallback（网络双通道容灾）。
# 0.1.97 发布主通道定谳（lock-face，工单 @d60fd3a2 §5 吸收③）：OIDC workflow
# = 主通道；本地 publish 仅在 workflow run 终态失败后启动（禁并发）——tag 时序
# = push tag → 等 workflow 终态 → 失败才本地。幂等守（下方 check 步）保证
# workflow 先发、本地后发单向 409 面；concurrency group npm-publish 串行多 tag。
# 主通道首用前置腿 = npm 侧 trusted publisher 配置确认（repo admin 操作面）；
# 未确认则该版走本地通道（本 workflow 修形照落），首用顺延。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 必需：npm trusted publisher 经 id-token 换 publish 权限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # 0.1.97 CI 告警清零波（工单 @d60fd3a2）：node 20 → 24——node 20 载
        # npm 10，不支持 OIDC trusted publishing（须 npm ≥11.5.1）→ publish 步
        # ENEEDAUTH 每推 tag 必红（v0.1.96 触发实据）。node 24 内载 npm 11
        # ≥11.5.1（大版本固定即可，不 pin 小版本）；build 步 bun 独立于 node，
        # 升级零影响。
        with:
          node-version: 24

      - name: Install bun（构建面仅依赖 bun build）
        run: npm i -g bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: 幂等检查（本地 token 已发过该版本则 no-op，双通道不冲突）
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@atlasharness/atlascode@$V" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@atlasharness/atlascode@$V 已在 registry，跳过发布"
          fi

      - name: Publish（OIDC + provenance）
        if: steps.check.outputs.exists != 'true'
        run: npm publish --access public --provenance
